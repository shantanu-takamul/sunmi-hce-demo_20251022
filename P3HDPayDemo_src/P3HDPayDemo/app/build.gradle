plugins {
    id 'com.android.application'
}

android {
    namespace "com.lfi.p3hd.demo"
    compileSdk 34

    defaultConfig {
        applicationId "com.lfi.p3hd.demo"
        minSdk 25
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    // BuildConfig.DEBUG gates anything that must never run in a shipped APK —
    // response-body logging, the offline TLS rig's simulator CA. AGP 8 stopped
    // generating BuildConfig unless asked.
    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        // android.util.Log is the only Android API the unit tests reach; let it
        // no-op instead of throwing "not mocked".
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Keystore-backed storage for the API key and the portal password. Every use is
    // guarded and falls back to the plain preferences file — see utils/SecurePrefs:
    // the Android Keystore is not uniformly reliable on vendor POS firmware, and a
    // terminal that cannot take payments is worse than one storing a key in plaintext.
    implementation 'androidx.security:security-crypto:1.0.0'

    // Trust-scope test only. Pinned to the okhttp version above: MockWebServer and
    // okhttp-tls share okhttp's internals, and a mismatch fails at run time, not
    // at resolution.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:3.14.9'
    testImplementation 'com.squareup.okhttp3:okhttp-tls:3.14.9'
}
